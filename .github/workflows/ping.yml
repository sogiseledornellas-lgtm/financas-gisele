name: Manter Supabase acordado

on:
  schedule:
    # Roda segunda, quarta e sexta às 12:00 UTC (09:00 de Brasília)
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Cutucar o banco de dados
        run: |
          echo "Enviando ping para o Supabase..."
          CODIGO=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://mbaglpzidkocemmyyyvf.supabase.co/rest/v1/transacoes?select=id&limit=1" \
            -H "apikey: sb_publishable_6GQHjwJk0EDR7A-sB75OFw_96zpE1ge" \
            -H "Authorization: Bearer sb_publishable_6GQHjwJk0EDR7A-sB75OFw_96zpE1ge")
          echo "Resposta do servidor: $CODIGO"
          if [ "$CODIGO" = "200" ]; then
            echo "Banco acordado com sucesso!"
          else
            echo "Atencao: o banco respondeu $CODIGO (pode estar pausado)."
            exit 1
          fi
